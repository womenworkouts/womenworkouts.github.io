<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Women Workouts</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://womenworkouts.github.io/">
<meta name="theme-color" content="#f2548b">
<meta property="og:type" content="website">
<meta property="og:title" content="Women Workouts — Home Workout App for Women">
<meta property="og:description" content="28-day home workout plans. No equipment, every move shown and voice-guided.">
<meta property="og:image" content="https://womenworkouts.github.io/assets/img/og-cover.png">
<meta property="og:url" content="https://womenworkouts.github.io/get/">
<link rel="icon" href="../assets/img/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/icon-180.png">
<script>
  // One link for bios and posts: phones go straight to their store, everything else stays on this page.
  // The source goes to Google Play as utm_source so installs can be attributed. In-app browsers name
  // themselves in the user agent, so the bare link needs no ?src=; ?src= still overrides it.
  (function () {
    var ua = navigator.userAgent || "";
    var inApp = /Instagram/i.test(ua) ? "instagram" : /FBAN|FBAV|FB_IAB/.test(ua) ? "facebook"
      : /TikTok|musical_ly|BytedanceWebview/i.test(ua) ? "tiktok" : "direct";
    var src = (new URLSearchParams(location.search).get("src") || inApp).replace(/[^\w.-]/g, "").slice(0, 40);
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    var appStore = "https://apps.apple.com/app/id1599554806";
    var play = "https://play.google.com/store/apps/details?id=com.betterlifewithapps.womenworkouts&referrer=" +
      encodeURIComponent("utm_source=" + src + "&utm_medium=smartlink");
    if (ios) location.replace(appStore);
    else if (android) location.replace(play);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #fff1f6; color: #211d20; }
  main { padding: 32px 16px; max-width: 420px; }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(113, 31, 63, .18); }
  h1 { font-size: 24px; margin: 20px 0 6px; }
  p { margin: 0 0 24px; color: #60575e; }
  a.btn { display: block; margin: 10px 0; padding: 14px 20px; border-radius: 999px; font-weight: 600;
          text-decoration: none; }
  a.primary { background: #f2548b; color: #fff; }
  a.ghost { background: #fff; color: #b5265c; border: 1.5px solid #ffbed3; }
  @media (prefers-color-scheme: dark) {
    body { background: #151215; color: #f8f4f7; }
    p { color: #b0a6ae; }
    a.ghost { background: #211d20; color: #ff92b6; border-color: #711f3f; }
  }
</style>
</head>
<body>
<main>
  <img src="../assets/img/icon-192.png" alt="Women Workouts app icon">
  <h1>Women Workouts</h1>
  <p>28-day home workout plans. No equipment needed.</p>
  <a class="btn primary" href="https://apps.apple.com/app/id1599554806">Download on the App Store</a>
  <a class="btn ghost" href="https://play.google.com/store/apps/details?id=com.betterlifewithapps.womenworkouts">Get it on Google Play</a>
</main>
</body>
</html>
